<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6853980997029870"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptCade</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        :root {
            --bg-base: #050505;
            --bg-surface: rgba(20, 20, 25, 0.7);
            --accent-primary: #00f0ff;
            --accent-secondary: #ff0055;
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        body {
            background: var(--bg-base);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LANDING MENU */
        #landing-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-base);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #landing-screen::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+') repeat;
            opacity: 0.5; z-index: -1; pointer-events: none;
        }
        .landing-content {
            text-align: center;
            opacity: 0; transform: translateY(40px);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }
        .logo-placeholder {
            width: 350px; height: auto; max-width: 80vw; margin-bottom: 40px;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
            object-fit: contain;
        }
        .enter-btn {
            padding: 18px 50px; font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;
            color: var(--bg-base); background: var(--accent-primary);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(255,255,255,0.5);
            transition: all 0.3s ease; text-transform: uppercase; position: relative; overflow: hidden;
        }
        .enter-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255,255,255,0.8);
            background: #fff; color: #000;
        }

        /* ARCADE CONTAINER */
        #arcade-container {
            padding: 40px 20px; max-width: 1300px; margin: 0 auto;
            display: none; opacity: 0;
            transition: opacity 1s ease;
        }
        .app-title {
            text-align: center; font-size: 3.5rem; font-weight: 900; letter-spacing: 4px;
            margin-bottom: 60px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,240,255,0.2));
            animation: pulseGlow 3s infinite alternate;
        }

        /* GRID & SLOTS */
        .section-title {
            font-size: 1.8rem; font-weight: 700; margin-bottom: 30px;
            display: flex; align-items: center; gap: 15px;
        }
        .section-title::after {
            content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
        }
        .game-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-bottom: 70px;
        }
        .slot {
            background: var(--bg-surface); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; transform: translateY(30px);
            /* animation added via JS */
        }
        .slot:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .thumbnail-area {
            height: 180px; background: #0a0a0a; background-size: cover; background-position: center;
            position: relative; cursor: pointer; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .thumbnail-area::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8) 100%);
        }
        .slot:hover .thumbnail-area { background-size: 110%; transition: background-size 0.5s ease; }
        .thumbnail-placeholder { font-size: 4em; font-weight: 900; color: rgba(255,255,255,0.1); }
        .badge {
            position: absolute; top: 15px; right: 15px; padding: 6px 12px; border-radius: 30px;
            font-size: 0.7rem; font-weight: 800; color: #fff; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 2; backdrop-filter: blur(5px);
        }
        .slot-controls { padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 2; }
        .game-title { margin: 0; font-size: 1.4rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .btn-play {
            background: rgba(255,255,255,0.05); color: var(--accent-primary); border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; letter-spacing: 1px; width: 100%;
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .slot:hover .btn-play { background: var(--accent-primary); color: #000; box-shadow: 0 0 15px rgba(0,240,255,0.4); }

        /* FULLSCREEN overlay */
        #fullscreen-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 10000; flex-direction: column;
            animation: fadeIn 0.3s ease forwards;
        }
        #game-header {
            height: 60px; background: #050505; display: flex; align-items: center; padding: 0 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05); justify-content: space-between;
        }
        #back-btn {
            background: rgba(255,0,85,0.1); color: var(--accent-secondary);
            padding: 8px 20px; border: 1px solid rgba(255,0,85,0.3); border-radius: 30px;
            cursor: pointer; font-weight: 700; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }
        #back-btn:hover { background: var(--accent-secondary); color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
        #playing-title { font-weight: 700; letter-spacing: 1px; color: var(--text-muted); }
        #game-frame { width: 100%; height: calc(100vh - 60px); border: none; background: #000; }

        /* ANIMATIONS */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 10px rgba(0,240,255,0.2)); } 100% { filter: drop-shadow(0 0 25px rgba(0,240,255,0.6)); } }
    </style>
</head>
<body>

    <!-- LANDING MENU -->
    <div id="landing-screen">
        <div class="landing-content">
            <!-- PLACEHOLDER LOGO - Replace 'src' with your actual .png file path -->
            <img id="logo-img" class="logo-placeholder" src="script.png" alt="ScriptCade Logo">
            <br>
            <button id="enter-btn" class="enter-btn" onclick="enterArcade()">ENTER</button>
        </div>
    </div>

    <!-- MAIN ARCADE -->
    <div id="arcade-container">
        <h1 class="app-title">ScriptCade</h1>
       
        <!-- HOT GAMES SECTION -->
        <h2 class="section-title" style="color: var(--accent-secondary);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>
            HOT RELEASES
        </h2>
        <div class="game-grid" id="hot-grid"></div>

        <!-- ALL GAMES SECTION -->
        <h2 class="section-title" style="color: var(--accent-primary);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            ALL GAMES
        </h2>
        <div class="game-grid" id="main-grid"></div>
    </div>

    <!-- FULLSCREEN GAME VIEW -->
    <div id="fullscreen-overlay">
        <div id="game-header">
            <button id="back-btn" onclick="closeGame()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                EXIT GAME
            </button>
            <span id="playing-title"></span>
        </div>
        <iframe id="game-frame" sandbox="allow-scripts allow-pointer-lock allow-same-origin allow-forms"></iframe>
    </div>

    <script>
        // --- 1. SYSTEM FUNCTIONS ---
       
        function enterArcade() {
            const landing = document.getElementById('landing-screen');
            const arcade = document.getElementById('arcade-container');
           
            // Animate landing screen out
            landing.style.transform = 'translateY(-50px)';
            landing.style.opacity = '0';
           
            setTimeout(() => {
                landing.style.display = 'none';
                arcade.style.display = 'block';
               
                // Small delay to allow display:block to apply before animating opacity
                setTimeout(() => {
                    arcade.style.opacity = '1';
                    loadHotGames();
                    loadGames();
                }, 50);
            }, 800);
        }

        function loadHotGames() {
            renderGrid(hotGamesList, 'hot-grid', 'hot');
        }

        function loadGames() {
            renderGrid(gamesList, 'main-grid', 'main');
        }

        function renderGrid(list, elementId, type) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            list.forEach((game, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                // Staggered animation delay based on index for a cascading wave effect
                slot.style.animation = `fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.15 + 0.2}s forwards`;
               
                slot.innerHTML = `
                    <div class="thumbnail-area" onclick="playGame('${type}', ${index})" style="background-image: url('${game.img}')">
                        ${!game.img || game.img === 'image' ? '<span class="thumbnail-placeholder">?</span>' : ''}
                        ${game.badgeText ? `<span class="badge" style="background:${game.badgeColor || 'var(--accent-primary)'}; color:${getContrastYIQ(game.badgeColor) === 'black' ? '#000' : '#fff'}">${game.badgeText}</span>` : ''}
                    </div>
                    <div class="slot-controls">
                        <h3 class="game-title" title="${game.title}">${game.title}</h3>
                        <button class="btn-play" onclick="playGame('${type}', ${index})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            PLAY NOW
                        </button>
                    </div>
                `;
                grid.appendChild(slot);
            });
        }

        // Helper to ensure badge text is legible regardless of badge background color
        function getContrastYIQ(hexcolor){
            if(!hexcolor) return 'black';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(x => x+x).join('');
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function playGame(listType, index) {
            let data = listType === 'hot' ? hotGamesList[index] : gamesList[index];
            if (!data) return;
           
            document.getElementById('playing-title').innerText = "Playing: " + data.title;
            const overlay = document.getElementById('fullscreen-overlay');
            const frame = document.getElementById('game-frame');
           
            overlay.style.display = 'flex';
            frame.src = data.url;
           
            if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch((e) => {}); }
        }

        function closeGame() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
            document.getElementById('game-frame').src = ''; // Clear source
            if (document.exitFullscreen) { document.exitFullscreen().catch((e) => {}); }
        }

        // --- 2. GAME LISTS ---
       
        // EDIT HOT GAMES HERE
        const hotGamesList = [
            {
                title: "Blade Ball",
                img: "bladethumb.png",
                badgeText: "HOT",
                badgeColor: "#ff4444",
                url: "https://scriptcade.github.io/blade-ball/"
            },
            {
                title: "Geometry Dash Maker",
                img: "gdthumb.jpeg",
                badgeText: "HOT",
                badgeColor: "#ff4444",
                url: "https://scriptcade.github.io/this-is-a-tesst-changing-later/"
            },
            {
                title: "Grow A Garden",
                img: "GrowAGardenthumb.avif",
                badgeText: "HOT",
                badgeColor: "#ff4444",
                url: "https://scriptcade.github.io/grow-a-garden-gemini/"
            }
        ];

        // EDIT REGULAR GAMES HERE
        const gamesList = [
            {
                title: "Among Us Clone",
                img: "amongusthumb.webp",
                badgeText: "FIRST PUBLISHED",
                badgeColor: "#00ff00",
                url: "https://scriptcade.github.io/among-us-gemini/"
            },
            {
                title: "Epic Plane Evolution",
                img: "epicplanethumb.jpeg",
                url: "https://scriptcade.github.io/epic-plane-evolution/"
            },
            {
                title: "Block Blast",
                img: "blockthumb.jpeg",
                badgeText: "SAVES DATA",
                badgeColor: "#E02222",
                url: "https://scriptcade.github.io/block-blast/"
            },
            {
                title: "Tower Defense Simulator",
                img: "tdsthumb.jpeg",
                url: "https://scriptcade.github.io/tds/"
            },
            {
                title: "Block Shooter",
                img: "BLOCK SHOOTER.png",
                badgeText: "NEW",
                badgeColor: "#22E0DA",
                url: "https://scriptcade.github.io/block-shooter/"
            },
            {
                title: "Doodle Glider",
                img: "Doodleglider.jpeg",
                badgeText: "One Prompt",
                badgeColor: "#fff200",
                url: "https://relthecreator.github.io/Doodle-Glider/"
            }

        ];
    </script>
</body>
</html>
