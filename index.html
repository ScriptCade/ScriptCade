<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6853980997029870"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptCade - The Ultimate Grind</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=VT323&display=swap');

        /* === 1. GLOBAL BASE VARIABLES & DEFAULT ANIMATION === */
        :root {
            --bg-main: radial-gradient(circle at 15% 30%, rgba(0, 240, 255, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 70%, rgba(255, 0, 85, 0.15) 0%, transparent 50%), #030307;
            --bg-surface: rgba(12, 12, 20, 0.8);
            --text-main: #ffffff;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff0055;
            --font-main: 'Outfit', system-ui, sans-serif;
            --radius-card: 16px;
            --radius-btn: 10px;
            --border-card: 2px solid rgba(255,255,255,0.06);
            --shadow-card: 0 20px 45px rgba(0,0,0,0.5);
            --cursor-style: crosshair;
        }

        body {
            background: var(--bg-main); color: var(--text-main);
            font-family: var(--font-main); margin: 0; min-height: 100vh;
            overflow-x: hidden; cursor: var(--cursor-style);
            background-size: 200% 200%;
            animation: defaultPulse 15s ease infinite alternate;
        }

        @keyframes defaultPulse { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* AMBIENT CRT SCANLINES */
        #ambient-scanlines { position: fixed; inset: 0; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%); z-index: 99999; background-size: 100% 4px; pointer-events: none; }
        body.in-game #ambient-scanlines { display: none; }

        /* ==========================================
           2. BASE THEMES WITH ANIMATIONS
           ========================================== */
           
        /* HACKER: Scrolling terminal effect */
        body.theme-hacker {
            --bg-main: repeating-linear-gradient(0deg, #020a02 0px, #020a02 2px, #000 2px, #000 4px);
            --bg-surface: #000000; --text-main: #00ff00; --accent-primary: #00ff00; --accent-secondary: #008800;
            --font-main: 'VT323', monospace; --radius-card: 0px; --radius-btn: 0px;
            --border-card: 1px solid #00ff00; --shadow-card: 0 0 10px rgba(0,255,0,0.1); --cursor-style: text;
            animation: hackerScroll 10s linear infinite;
        }
        @keyframes hackerScroll { from { background-position: 0 0; } to { background-position: 0 100vh; } }

        /* RETRO: Pulsing outrun neon */
        body.theme-retro {
            --bg-main: linear-gradient(180deg, #1a0b2e 0%, #4a154b 60%, #ff8800 100%);
            --bg-surface: rgba(20, 10, 40, 0.9); --text-main: #ffeeff; --accent-primary: #f700ff; --accent-secondary: #00e5ff;
            --font-main: 'Outfit', sans-serif; --radius-card: 8px; --radius-btn: 20px;
            --border-card: 2px solid #f700ff; --shadow-card: 0 10px 25px rgba(247,0,255,0.2);
            animation: none;
        }
        body.theme-retro .app-title { animation: retroGlow 2s ease-in-out infinite alternate; }
        @keyframes retroGlow { from { text-shadow: 0 0 10px #f700ff, 0 0 20px #f700ff; } to { text-shadow: 0 0 20px #00e5ff, 0 0 30px #00e5ff; } }

        /* VAPORWAVE: Floaty OS windows */
        body.theme-vapor {
            --bg-main: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --bg-surface: #c0c0c0; --text-main: #000000; --accent-primary: #000080; --accent-secondary: #008080;
            --font-main: 'Tahoma', sans-serif; --radius-card: 0px; --radius-btn: 0px;
            --border-card: 2px solid #dfdfdf; border-color: #dfdfdf #000 #000 #dfdfdf; --shadow-card: none; --cursor-style: default;
            animation: none;
        }
        body.theme-vapor .slot { animation: vaporFloat 4s ease-in-out infinite; }
        @keyframes vaporFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* ==========================================
           3. UNLOCKABLE THEMES WITH ANIMATIONS
           ========================================== */

        /* GOLD VIP: Breathing luxurious aura */
        body.theme-gold {
            --bg-main: radial-gradient(circle at 50% 50%, #1a1813 0%, #050505 100%);
            --bg-surface: linear-gradient(145deg, #1f1b0f, #0a0905);
            --text-main: #f5e0a3; --accent-primary: #ffd700; --accent-secondary: #b8860b;
            --radius-card: 4px; --radius-btn: 4px; --border-card: 1px solid #ffd700; --shadow-card: 0 10px 30px rgba(255, 215, 0, 0.15);
            animation: none;
        }
        body.theme-gold .slot { animation: goldAura 3s ease-in-out infinite alternate; }
        @keyframes goldAura { from { box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1); } to { box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3); } }

        /* BLOOD MOON: Double-beat heartbeat */
        body.theme-blood {
            --bg-main: radial-gradient(circle at 50% -20%, #4a0000 0%, #000000 70%);
            --bg-surface: rgba(15, 0, 0, 0.9); --text-main: #ffaaaa; --accent-primary: #ff0000; --accent-secondary: #880000;
            --radius-card: 0px; --radius-btn: 0px; --border-card: 1px solid #ff0000; --shadow-card: 0 15px 40px rgba(255,0,0,0.3);
            animation: none;
        }
        body.theme-blood .slot { animation: bloodHeartbeat 1.5s infinite; transform-origin: center; }
        @keyframes bloodHeartbeat { 0%, 100% { transform: scale(1); border-color: #ff0000; } 15% { transform: scale(1.02); border-color: #ff5555; box-shadow: 0 0 30px rgba(255,0,0,0.6); } 30% { transform: scale(1); border-color: #ff0000; } 45% { transform: scale(1.02); border-color: #ff5555; box-shadow: 0 0 30px rgba(255,0,0,0.6); } }

        /* DEEP SPACE: Endless cosmic drift */
        body.theme-space {
            --bg-main: radial-gradient(circle at 20% 80%, #2b00ff 0%, transparent 40%), radial-gradient(circle at 80% 20%, #aa00ff 0%, #00001a 60%);
            --bg-surface: rgba(10, 10, 30, 0.6); --text-main: #e6e6ff; --accent-primary: #bb88ff; --accent-secondary: #4400ff;
            --radius-card: 24px; --radius-btn: 12px; --border-card: 1px solid rgba(255,255,255,0.1); --shadow-card: 0 0 40px rgba(170,0,255,0.2);
            background-size: 200% 200%;
            animation: spaceDrift 12s linear infinite alternate;
        }
        @keyframes spaceDrift { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }

        /* ==========================================
           4. ENDGAME THEMES WITH INTENSE ANIMATIONS
           ========================================== */

        /* CORRUPTED CORE: Aggressive screen tear & skew */
        body.theme-glitch {
            --bg-main: linear-gradient(45deg, #15001a 25%, #050010 75%);
            --bg-surface: rgba(30, 0, 40, 0.75); --text-main: #e0b0ff; --accent-primary: #bd00ff; --accent-secondary: #00ff66;
            --border-card: 2px dashed #bd00ff; --shadow-card: 0 0 30px rgba(189,0,255,0.3);
            animation: none;
        }
        body.theme-glitch .app-title { animation: glitchText 0.3s infinite; }
        @keyframes glitchText { 0% { transform: translate(0); text-shadow: 3px -3px 0px var(--accent-secondary); } 20% { transform: translate(-2px, 2px) skew(-5deg); text-shadow: -3px 3px 0px var(--accent-secondary); } 40% { transform: translate(2px, -2px) skew(5deg); text-shadow: 3px -3px 0px var(--accent-secondary); } 60% { transform: translate(-2px, -2px); text-shadow: -3px -3px 0px var(--accent-secondary); } 80% { transform: translate(2px, 2px); text-shadow: 3px 3px 0px var(--accent-secondary); } 100% { transform: translate(0); text-shadow: 3px -3px 0px var(--accent-secondary); } }

        /* ARCADE LEGEND: Classic flashing insert coin text */
        body.theme-legend {
            --bg-main: #2b1810;
            --bg-surface: #111111; --text-main: #ffea00; --accent-primary: #ffea00; --accent-secondary: #ff00ff;
            --font-main: 'VT323', monospace; --radius-card: 4px; --radius-btn: 4px;
            --border-card: 4px solid #ff00ff; --shadow-card: 0 0 20px #ff00ff;
            animation: none;
        }
        body.theme-legend .slot { background: #000; border-top: 8px solid #ffea00; }
        body.theme-legend .app-title { color: #ffea00; text-shadow: 4px 4px 0px #ff00ff; animation: arcadeBlink 1s step-end infinite; }
        @keyframes arcadeBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ABSOLUTE ZERO: Flowing iridescent liquid glass */
        body.theme-god {
            --bg-main: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #000000 100%);
            --bg-surface: rgba(255, 255, 255, 0.05); --text-main: #f1f5f9; --accent-primary: #38bdf8; --accent-secondary: #e2e8f0;
            --radius-card: 30px; --radius-btn: 15px; --border-card: 1px solid rgba(255,255,255,0.2);
            --shadow-card: 0 0 50px rgba(56,189,248,0.25); backdrop-filter: blur(25px);
            background-size: 300% 300%;
            animation: godShimmer 8s ease infinite;
        }
        body.theme-god .app-title { background: linear-gradient(to right, #fff, #38bdf8, #fff); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 12px; font-weight: 900; filter: drop-shadow(0 0 20px rgba(56,189,248,0.5)); animation: godTextShine 3s linear infinite; }
        @keyframes godShimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes godTextShine { to { background-position: 200% center; } }
        body.theme-god .slot:hover { border-color: #38bdf8; }
        body.theme-god .btn-play { background: rgba(56,189,248,0.1); border-color: #38bdf8; }

        /* ==========================================
           THEME VAULT SYSTEM
           ========================================== */
        #theme-btn {
            position: fixed; top: 20px; right: 20px; z-index: 99990;
            background: var(--bg-surface); border: 2px solid var(--accent-primary); color: var(--accent-primary);
            padding: 10px 20px; font-weight: 900; font-family: var(--font-main); border-radius: var(--radius-btn);
            cursor: inherit; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
        }
        #theme-btn:hover { background: var(--accent-primary); color: #000; box-shadow: 0 0 20px var(--accent-primary); transform: scale(1.05); }
        body.in-game #theme-btn { display: none; }

        #theme-vault-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 100000; backdrop-filter: blur(15px); flex-direction: column; align-items: center; justify-content: center;
        }
        .vault-content {
            background: var(--bg-surface); border: 2px solid var(--accent-secondary); width: 90%; max-width: 650px;
            border-radius: var(--radius-card); padding: 40px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            max-height: 85vh; overflow-y: auto;
        }
        .vault-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .vault-title { font-size: 2rem; font-weight: 900; margin: 0; color: var(--accent-primary); }
        .close-vault { background: transparent; border: none; color: #fff; font-size: 2rem; cursor: pointer; }
       
        .playtime-tracker { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 30px; border: 1px solid var(--accent-secondary); }
        .playtime-tracker h3 { margin: 0 0 5px 0; color: #8892b0; font-size: 0.9rem; letter-spacing: 1px; }
        .playtime-tracker .time { font-size: 2.3rem; font-weight: 900; color: #fff; font-family: monospace; }

        .theme-option {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; margin-bottom: 15px; transition: 0.2s;
        }
        .theme-option.unlocked:hover { background: rgba(255,255,255,0.07); border-color: var(--accent-primary); }
        .theme-info h4 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .theme-info p { margin: 0; font-size: 0.85rem; color: #8892b0; }
       
        .theme-action-btn { padding: 8px 15px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-family: var(--font-main); }
        .btn-equip { background: var(--accent-primary); color: #000; }
        .btn-equipped { background: transparent; border: 2px solid var(--accent-primary); color: var(--accent-primary); cursor: default; }
        .theme-locked { opacity: 0.4; border-color: rgba(255, 0, 85, 0.2) !important; }
        .locked-timer { color: #ff4444; font-family: monospace; font-weight: bold; font-size: 1rem; text-align: right; }

        /* CORE WEB LAYOUT STYLING */
        #landing-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .landing-content { text-align: center; opacity: 0; transform: translateY(30px); animation: fadeUp 0.8s forwards; }
        .enter-btn { padding: 18px 55px; font-size: 1.3rem; font-weight: 900; letter-spacing: 3px; color: var(--text-main); background: var(--bg-surface); border: 3px solid var(--accent-primary); border-radius: var(--radius-btn); cursor: inherit; transition: 0.2s; text-transform: uppercase; }
        .enter-btn:hover { background: var(--accent-primary); color: #000; transform: scale(1.05); }

        #crt-flash { position: fixed; inset: 0; background: #fff; z-index: 100000; pointer-events: none; transform: scaleY(0.005) scaleX(0); opacity: 0; }
        .crt-animate { animation: crtPowerOn 0.9s forwards; }

        #arcade-container { padding: 50px 20px; max-width: 1400px; margin: 0 auto; display: none; opacity: 0; }
        .app-title { text-align: center; font-size: 4.5rem; font-weight: 900; letter-spacing: 5px; margin-bottom: 60px; text-transform: uppercase; }

        .section-title { font-size: 2rem; font-weight: 900; margin-bottom: 35px; letter-spacing: 2px; display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, currentColor, transparent); }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 40px; margin-bottom: 80px; }
       
        .slot { background: var(--bg-surface); border-radius: var(--radius-card); overflow: hidden; border: var(--border-card); backdrop-filter: blur(12px); transition: transform 0.3s, box-shadow 0.3s; opacity: 0; transform: translateY(20px); position: relative; }
        .slot:hover { transform: translateY(-10px) scale(1.03) !important; box-shadow: var(--shadow-card); }
        .thumbnail-area { height: 190px; background: #06060a; background-size: cover; background-position: center; position: relative; cursor: inherit; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .slot:hover .thumbnail-area { background-size: 112%; transition: 0.3s; }
       
        /* THE BADGE SYSTEM */
        .badge { position: absolute; top: 15px; right: 15px; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 900; z-index: 4; text-transform: uppercase; background: #333; color: #fff; border: 2px solid #fff; }
        .slot-controls { padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; }
        .game-title { margin: 0; font-size: 1.35rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-play { padding: 13px; border-radius: var(--radius-btn); cursor: inherit; font-weight: 700; letter-spacing: 1px; width: 100%; transition: 0.2s; text-transform: uppercase; background: transparent; border: 1px solid var(--text-main); color: var(--text-main); }
        .slot:hover .btn-play { background: var(--text-main); color: var(--bg-surface); border-color: var(--text-main); }

        #fullscreen-overlay { display: none; position: fixed; inset: 0; background: var(--bg-surface); z-index: 100000; flex-direction: column; }
        #game-header { height: 60px; display: flex; align-items: center; padding: 0 25px; border-bottom: 2px solid var(--accent-primary); justify-content: space-between; }
        #back-btn { background: transparent; color: var(--text-main); border: 2px solid var(--accent-primary); padding: 8px 22px; font-weight: 700; cursor: inherit; border-radius: var(--radius-btn); }
        #playing-title { font-weight: 700; letter-spacing: 1px; color: var(--text-main); }
        #game-frame { width: 100%; height: calc(100vh - 60px); border: none; }

        @keyframes crtPowerOn { 0% { transform: scaleY(0.002) scaleX(0); opacity: 1; } 35% { transform: scaleY(0.002) scaleX(1); opacity: 1; } 65% { transform: scaleY(1) scaleX(1); opacity: 1; filter: brightness(2); } 100% { transform: scaleY(1) scaleX(1); opacity: 0; filter: brightness(1); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="ambient-scanlines"></div>

    <button id="theme-btn" onclick="openVault()">[ THEME VAULT ]</button>

    <div id="theme-vault-modal">
        <div class="vault-content">
            <div class="vault-header">
                <h2 class="vault-title">THEME VAULT</h2>
                <button class="close-vault" onclick="closeVault()">×</button>
            </div>
           
            <div class="playtime-tracker">
                <h3>TOTAL ARCADE PLAYTIME</h3>
                <div class="time" id="vault-time-display">00:00:00</div>
            </div>

            <div id="theme-list-container"></div>
        </div>
    </div>

    <div id="landing-screen">
        <div class="landing-content">
            <h1 class="app-title" style="margin-bottom: 20px;">ScriptCade</h1>
            <button id="enter-btn" class="enter-btn" onclick="enterArcade()">BOOT.EXE</button>
        </div>
    </div>

    <div id="arcade-container">
        <h1 class="app-title">ScriptCade</h1>
       
        <h2 class="section-title">🔥 VITAL RELEASES 🔥</h2>
        <div class="game-grid" id="hot-grid"></div>

        <h2 class="section-title">💾 SYSTEM MAINBOARD 💾</h2>
        <div class="game-grid" id="main-grid"></div>
    </div>

    <div id="fullscreen-overlay">
        <div id="game-header">
            <button id="back-btn" onclick="closeGame()">◀ TERMINATE</button>
            <span id="playing-title"></span>
        </div>
        <iframe id="game-frame" sandbox="allow-scripts allow-pointer-lock allow-same-origin allow-forms"></iframe>
    </div>

    <script>
        // --- 0. PLAYTIME & EXPANDED THEME VAULT ---
        let totalPlaytimeSeconds = parseInt(localStorage.getItem('scriptcade-playtime')) || 0;
        let playtimeInterval = null;
        let activeTheme = localStorage.getItem('scriptcade-theme') || 'default';

        const themes = [
            { id: 'default', name: 'Neon Cyber', desc: 'The classic ScriptCade experience.', req: 0 },
            { id: 'theme-hacker', name: 'Terminal Hacker', desc: 'Pure code layout. No curves.', req: 0 },
            { id: 'theme-retro', name: 'Retro Synthwave', desc: '80s arcade sunset aesthetic.', req: 0 },
            { id: 'theme-vapor', name: 'Vaporwave OS', desc: 'Windows 95 interface styling.', req: 0 },
            { id: 'theme-gold', name: 'Gold VIP', desc: 'Sleek black and gold configuration.', req: 60 },
            { id: 'theme-blood', name: 'Blood Moon', desc: 'Dark, crimson nightmare fuel.', req: 300 },
            { id: 'theme-space', name: 'Deep Space', desc: 'Cosmic galaxy background matrix.', req: 600 },
            { id: 'theme-glitch', name: 'Corrupted Core', desc: '⚠️ GLITCH WORKSTATION UNLOCKED ⚠️', req: 3600 },
            { id: 'theme-legend', name: 'Arcade Legend', desc: '🔥 TRUE RETRO CABINET ARCHITECTURE 🔥', req: 18000 },
            { id: 'theme-god', name: 'Absolute Zero', desc: '👑 ULTIMATE 24-HOUR GOD MODE PLATINUM 👑', req: 86400 }
        ];

        function formatTime(totalSecs) {
            const h = Math.floor(totalSecs / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSecs % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSecs % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function applyTheme(themeId) {
            document.body.className = document.body.className.replace(/\btheme-[^\s]+\b/g, '');
            if (themeId !== 'default') document.body.classList.add(themeId);
            activeTheme = themeId;
            localStorage.setItem('scriptcade-theme', themeId);
            renderVault();
        }

        function openVault() {
            document.getElementById('theme-vault-modal').style.display = 'flex';
            renderVault();
        }

        function closeVault() { document.getElementById('theme-vault-modal').style.display = 'none'; }

        function renderVault() {
            document.getElementById('vault-time-display').innerText = formatTime(totalPlaytimeSeconds);
            const container = document.getElementById('theme-list-container');
            container.innerHTML = '';

            themes.forEach(theme => {
                const isUnlocked = totalPlaytimeSeconds >= theme.req;
                const isEquipped = activeTheme === theme.id;
               
                let buttonHTML = '';
                if (!isUnlocked) {
                    const diff = theme.req - totalPlaytimeSeconds;
                    buttonHTML = `<div class="locked-timer">NEED ${formatTime(diff)}</div>`;
                } else if (isEquipped) {
                    buttonHTML = `<button class="theme-action-btn btn-equipped">EQUIPPED</button>`;
                } else {
                    buttonHTML = `<button class="theme-action-btn btn-equip" onclick="applyTheme('${theme.id}')">EQUIP</button>`;
                }

                container.innerHTML += `
                    <div class="theme-option ${isUnlocked ? 'unlocked' : 'theme-locked'}">
                        <div class="theme-info">
                            <h4>${theme.name} ${!isUnlocked ? '🔒' : ''}</h4>
                            <p>${theme.desc}</p>
                        </div>
                        ${buttonHTML}
                    </div>
                `;
            });
        }

        window.onload = () => { applyTheme(activeTheme); };

        // --- 1. SYSTEM INITIALIZATION ---
        function enterArcade() {
            document.getElementById('enter-btn').innerText = "EXECUTING...";
            setTimeout(() => {
                const flash = document.createElement('div');
                flash.id = 'crt-flash';
                document.body.appendChild(flash);
                setTimeout(() => { flash.classList.add('crt-animate'); }, 10);
                setTimeout(() => {
                    document.getElementById('landing-screen').style.display = 'none';
                    const arcade = document.getElementById('arcade-container');
                    arcade.style.display = 'block';
                    arcade.style.opacity = '1';
                    loadHotGames();
                    loadGames();
                }, 450);
                setTimeout(() => { flash.remove(); }, 1200);
            }, 300);
        }

        function renderGrid(list, elementId, type) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            list.forEach((game, index) => {
                const slot = document.createElement('div');
                let badgeHTML = '';
               
                if (game.badgeText) {
                    let customColorStyle = game.badgeColor
                        ? `style="background-color: ${game.badgeColor} !important; border-color: ${game.badgeColor} !important; box-shadow: 0 0 15px ${game.badgeColor}; color: #fff !important;"`
                        : '';
                    badgeHTML = `<span class="badge" ${customColorStyle}>${game.badgeText}</span>`;
                }
               
                slot.className = `slot`;
                slot.style.animation = `fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.06}s forwards`;
               
                slot.innerHTML = `
                    <div class="thumbnail-area" onclick="playGame('${type}', ${index})" style="background-image: url('${game.img}')">
                        ${!game.img || game.img === 'image' ? '<span style="font-size:3rem;font-weight:700;color:rgba(255,255,255,0.2);">IMG_NULL</span>' : ''}
                        ${badgeHTML}
                    </div>
                    <div class="slot-controls">
                        <h3 class="game-title" title="${game.title}">${game.title}</h3>
                        <button class="btn-play" onclick="playGame('${type}', ${index})">LAUNCH</button>
                    </div>
                `;
                grid.appendChild(slot);
            });
        }

        function loadHotGames() { renderGrid(hotGamesList, 'hot-grid', 'hot'); }
        function loadGames() { renderGrid(gamesList, 'main-grid', 'main'); }

        function playGame(listType, index) {
            let data = listType === 'hot' ? hotGamesList[index] : gamesList[index];
            if (!data) return;
           
            document.body.classList.add('in-game');
            document.getElementById('playing-title').innerText = "CONNECTED: " + data.title.toUpperCase();
           
            const overlay = document.getElementById('fullscreen-overlay');
            const frame = document.getElementById('game-frame');
            overlay.style.display = 'flex';
            frame.src = data.url;
            if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch((e) => {}); }

            playtimeInterval = setInterval(() => {
                totalPlaytimeSeconds++;
                localStorage.setItem('scriptcade-playtime', totalPlaytimeSeconds);
                if(document.getElementById('theme-vault-modal').style.display === 'flex') {
                    renderVault();
                }
            }, 1000);
        }

        function closeGame() {
            document.body.classList.remove('in-game');
            document.getElementById('fullscreen-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            if (document.exitFullscreen) { document.exitFullscreen().catch((e) => {}); }
            clearInterval(playtimeInterval);
        }
